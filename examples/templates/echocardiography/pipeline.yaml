pipeline:
    operations:
    - beamform
    - envelope_detect
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
    - scan_convert
parameters:
    selected_transmits: all
    n_ch: 1
    grid_size_x: 200
    grid_size_z: 400
    pixels_per_wavelength: 2
    f_number: 0.6
    grid_type: polar
    polar_limits:
    - -0.785398
    - 0.785398
    zlims:
    - 0.0
    - 0.04
