pipeline:
    operations:
    -   name: keras.ops.cast
        params:
            dtype: float32
    - demodulate
    -   name: beamform
        params:
            num_patches: 200
    - envelope_detect
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
parameters:
    grid_size_x: 580
    grid_size_z: 600
    dynamic_range:
    - -40
    - 0
    zlims:
    - 0.0065
    - 0.058
    apply_lens_correction: true
