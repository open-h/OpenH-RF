pipeline:
    name: pipeline
    operations:
    # Overlap averaging creates fractional RF, and Hadamard decoding can exceed int16.
    - demodulate
    -   name: beamform
        params:
            enable_pfield: false
    - envelope_detect
    # Use the true maximum; percentile normalization would clip strong reflectors.
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
parameters:
    sound_speed: 1540
    # Derive both grid dimensions at three samples per acoustic wavelength.
    pixels_per_wavelength: 3
    dynamic_range:
    - -60
    - 0
